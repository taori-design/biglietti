<style>
@font-face { font-family: "Instrument Sans"; src: url("../assets/instrumentsans.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url("../assets/plexmono-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
:root { --fondo:#000; --sup:#0A0A0C; --riga:#1C1C20; --testo:#F5F5F7; --sec:#A8A8B1; --ocra:#D4A63C; --su-ocra:#111113; }
* { box-sizing: border-box; margin: 0; }
html { background: var(--fondo); color: var(--testo); font: 400 17px/1.5 "Instrument Sans", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
body { min-height: 100svh; display: flex; justify-content: center; padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom)); }
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 28px; }
.marchio { width: 132px; height: auto; display: block; }
.testa { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
.foto { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; }
.iniziali { display: grid; place-items: center; background: var(--sup); border: 1px solid var(--riga); color: var(--sec); font-size: 26px; letter-spacing: -0.02em; }
h1 { font-weight: 400; font-size: clamp(38px, 11vw, 48px); line-height: 1.02; letter-spacing: -0.04em; }
.ruolo { font: 600 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ocra); }
.frase { color: var(--sec); max-width: 34ch; }
.salva { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: var(--ocra); color: var(--su-ocra); font-weight: 600; font-size: 17px; text-decoration: none; }
.salva:active { transform: scale(0.98); }
.salva svg { width: 20px; height: 20px; }
.contatti { display: flex; flex-direction: column; border-top: 1px solid var(--riga); }
.riga { display: flex; align-items: center; gap: 16px; padding: 15px 2px; border-bottom: 1px solid var(--riga); color: var(--testo); text-decoration: none; }
.riga svg { width: 22px; height: 22px; color: var(--sec); flex: none; }
.riga span { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.riga small { font: 600 10.5px/1.6 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; color: var(--sec); }
footer { margin-top: auto; padding-top: 8px; color: var(--sec); font-size: 14px; }
footer strong { color: var(--testo); font-weight: 400; }
</style>
</head>
